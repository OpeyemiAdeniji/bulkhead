# Defaults for the tenant chart.
# The tenant file (tenants/<name>.yaml) is passed in as extra values and supplies
# schemaVersion, name, owner, costCentre, environment, size and access. Values that are the
# same for every tenant of a cluster go in one file that is passed before the tenant file:
#   helm template tenant-alpha charts/bulkhead-tenant -f cluster-values.yaml -f tenants/alpha.yaml
# (docs/adr/0016-two-charts-configurable-per-cluster.md)

# The namespace of a tenant is <namespacePrefix><name>. Platform namespaces must never start
# with this prefix (docs/adr/0005-tenant-contract-yaml-json-schema.md).
namespacePrefix: tenant-

# The Pod Security Standard that every tenant namespace enforces: restricted or baseline.
podSecurity:
  level: restricted

# Where pods may send DNS lookups. The defaults match CoreDNS and kube-dns on kind, kubeadm,
# Amazon EKS, Google Kubernetes Engine and Azure Kubernetes Service. extraCIDRs is for DNS
# that is not served by those pods, for example 169.254.20.10/32 for NodeLocal DNSCache.
dns:
  namespaceLabels:
    kubernetes.io/metadata.name: kube-system
  podLabels:
    k8s-app: kube-dns
  # More DNS pods in the same namespace, one label set each. NodeLocal DNSCache on GKE answers
  # queries to the DNS service from pods labelled k8s-app: node-local-dns, so without this entry
  # tenant DNS fails there (measured on GKE 1.36, docs/measurements.md). On clusters without
  # those pods, the entry matches nothing.
  extraPodLabels:
    - k8s-app: node-local-dns
  ports: [53]
  extraCIDRs: []

# The size tiers are design choices, not measurements. Medium is twice small and
# large is four times small. A quota limits what a tenant may claim, not what it uses.
sizes:
  small:
    requests: {cpu: "500m", memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
    pods: 10
    services: 5
    persistentvolumeclaims: 2
  medium:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
    pods: 20
    services: 10
    persistentvolumeclaims: 4
  large:
    requests: {cpu: "2", memory: 2Gi}
    limits: {cpu: "4", memory: 4Gi}
    pods: 40
    services: 20
    persistentvolumeclaims: 8

# Defaults for containers that do not set their own requests and limits.
# One tenth of the small tier, so that the 10 pods that the small tier allows also fit
# when none of them sets resources (10 x 50m = 500m requests, 10 x 100m = 1 CPU limits).
# Medium and large scale CPU, memory and pods together, so the same holds for them.
# Before 2026-11-14 the default limit was 500m CPU, and only two such pods fitted.
containerDefaults:
  request: {cpu: 50m, memory: 50Mi}
  limit: {cpu: 100m, memory: 100Mi}
