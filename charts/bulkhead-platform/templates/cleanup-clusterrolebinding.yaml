# Gives the role of cleanup-clusterrole.yaml to the Kyverno cleanup controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bulkhead-cleanup-policyexceptions
  labels:
    {{- include "platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bulkhead-cleanup-policyexceptions
subjects:
  - kind: ServiceAccount
    name: {{ .Values.kyverno.cleanupServiceAccount }}
    namespace: {{ .Values.kyverno.namespace }}
