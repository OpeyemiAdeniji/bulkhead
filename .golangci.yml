# golangci-lint v2 configuration for the checker (the version is pinned in .github/workflows/ci.yml).
version: "2"

linters:
  default: standard
  enable:
    - errorlint     # errors are compared with errors.Is and errors.As, so wrapping keeps working
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      locale: UK
  exclusions:
    rules:
      # The titles of benchmark items are quoted as published, in US spelling ("Minimize").
      - path: internal/catalog/benchmarks(_test)?\.go
        linters:
          - misspell

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OpeyemiAdeniji/bulkhead
