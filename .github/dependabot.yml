# Weekly pull requests that bump pinned versions.
# Not covered here: the tool versions in scripts/install-tools.sh, the Kyverno chart in
# platform/kyverno, Calico in scripts/cluster-up.sh and the pre-commit hooks
# (make hooks-update). Those are bumped by hand, together with a measurement run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python:
        patterns: ["*"]
