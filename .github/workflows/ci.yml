name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validate tenant files
        run: make validate
      - name: Run contract tests
        run: make test-contract
      - name: Validate policy exceptions
        run: make validate-exceptions
      - name: Run exception tests
        run: make test-exceptions

  chart:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin" helm kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint, render and schema-check both charts
        run: make chart-test
      - name: Package the charts as a release would, and read the notes of the last release
        run: |
          bash scripts/package-charts.sh 0.0.0-ci dist
          bash scripts/release-notes.sh 0.2.0 > /dev/null

  # The checker, bulkhead check (docs/adr/0018-checker-in-this-repository.md).
  checker:
    name: checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go version, as switched to by the toolchain line of go.mod
        run: go version
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Tests with the race detector
        run: go test -race -count=1 ./...
      - name: Known vulnerabilities in the code and its dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Build and run the binary
        run: |
          make checker-build
          ./bin/bulkhead version
          ./bin/bulkhead check --list > /dev/null
          set +e; ./bin/bulkhead check --list --category nope > /dev/null 2>&1; code=$?; set -e
          [ "$code" -eq 2 ] || { echo "a usage error must exit with 2, got $code"; exit 1; }

  isolation:
    name: isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin" kind kubectl helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the cluster
        run: make cluster-up
      - name: Apply the tenants
        run: make tenants-apply
      - name: Run the isolation tests
        run: make test-isolation
      - name: Show the cluster state after a failure
        if: failure()
        run: |
          kubectl --context kind-bulkhead get nodes -o wide || true
          kubectl --context kind-bulkhead get pods -A -o wide || true
          kubectl --context kind-bulkhead get events -A --sort-by=.lastTimestamp | tail -50 || true
          echo "--- kernel log (shared by all nodes, because they are containers on one host)"
          docker exec bulkhead-control-plane dmesg 2>&1 | grep -iE 'oom|out of memory|killed process|not permitted|denied' | tail -20 || true

  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Kyverno CLI
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin" kyverno helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test the policies
        run: make policy-test

  policy-live:
    name: policy-live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin" kind kubectl helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the cluster
        run: make cluster-up
      - name: Apply the tenants
        run: make tenants-apply
      - name: Install Kyverno and the policies
        run: make kyverno-up
      - name: Run the live policy tests
        run: make test-policy-live
      - name: Show the cluster state after a failure
        if: failure()
        run: |
          kubectl --context kind-bulkhead get pods -A -o wide || true
          kubectl --context kind-bulkhead get events -A --sort-by=.lastTimestamp | tail -50 || true

  # The jobs above run Kubernetes 1.37 with Calico and are required checks. This one runs both
  # suites on the two older supported Kubernetes versions, and with a second network plugin,
  # so that the claims do not depend on one version or on Calico. It is not required yet.
  compatibility:
    name: compatibility (Kubernetes ${{ matrix.k8s }}, ${{ matrix.cni }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {k8s: 1.36.4, cni: calico}
          - {k8s: 1.35.8, cni: cilium}
          - {k8s: 1.37.0, cni: cilium}
    env:
      K8S_VERSION: ${{ matrix.k8s }}
      CNI: ${{ matrix.cni }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin" kind kubectl helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the cluster
        run: make cluster-up
      - name: Apply the tenants
        run: make tenants-apply
      - name: Run the isolation tests
        run: make test-isolation
      - name: Install Kyverno and the policies
        run: make kyverno-up
      - name: Run the live policy tests
        run: make test-policy-live
      - name: Show the cluster state after a failure
        if: failure()
        run: |
          kubectl --context kind-bulkhead get nodes -o wide || true
          kubectl --context kind-bulkhead get pods -A -o wide || true
          kubectl --context kind-bulkhead get events -A --sort-by=.lastTimestamp | tail -50 || true

  # Runs the quick start block of the README as written, on a fresh runner, so that the
  # instructions cannot go stale. Not a required check yet.
  quickstart:
    name: quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run the README quick start as written
        run: bash scripts/readme-quickstart.sh

  # Keep the job names stable: the ruleset matches required checks by name.
  # Actions are pinned to commit SHAs. Dependabot proposes updates (.github/dependabot.yml).
