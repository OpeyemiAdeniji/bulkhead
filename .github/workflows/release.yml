name: Release

# A version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) publishes both charts to ghcr.io,
# signs them, attests how they were built, and creates the GitHub release from the changelog.
# Releases are only made here, never from a laptop (docs/adr/0017-signed-chart-releases.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  charts:
    name: charts
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release and upload the packages
      packages: write       # push the charts to ghcr.io
      id-token: write       # sign without a key, with the identity of this workflow
      attestations: write   # record the build provenance
    env:
      REGISTRY: ghcr.io/opeyemiadeniji/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned tools
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin" helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Check the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            # A final release needs its section in the changelog.
            bash scripts/release-notes.sh "$version" > /dev/null
          fi

      - name: Package the charts
        run: bash scripts/package-charts.sh "${{ steps.version.outputs.version }}" dist

      - name: Push and sign the charts
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Helm and cosign keep separate logins, so both log in. Found by the v0.3.0-rc.1 run.
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for name in bulkhead-tenant bulkhead-platform; do
            out="$(helm push "dist/$name-$VERSION.tgz" "oci://$REGISTRY" 2>&1)"
            echo "$out"
            digest="$(grep -oE 'sha256:[0-9a-f]{64}' <<< "$out" | head -1)"
            [ -n "$digest" ] || { echo "no digest for $name" >&2; exit 1; }
            cosign sign --yes "$REGISTRY/$name@$digest"
            echo "${name//-/_}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Attest the build of bulkhead-tenant
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/bulkhead-tenant
          subject-digest: ${{ steps.push.outputs.bulkhead_tenant_digest }}
          push-to-registry: true

      - name: Attest the build of bulkhead-platform
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/bulkhead-platform
          subject-digest: ${{ steps.push.outputs.bulkhead_platform_digest }}
          push-to-registry: true

      - name: Verify the signatures, as a user would
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for name in bulkhead-tenant bulkhead-platform; do
            cosign verify "$REGISTRY/$name:$VERSION" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified $REGISTRY/$name:$VERSION"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            printf 'Pre-release for testing. Charts: `oci://%s/bulkhead-tenant` and `oci://%s/bulkhead-platform`, version %s.\n' "$REGISTRY" "$REGISTRY" "$VERSION" > notes.md
            flags=(--prerelease)
          else
            bash scripts/release-notes.sh "$VERSION" > notes.md
            flags=()
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}" dist/*.tgz
